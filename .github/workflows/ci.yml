name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  # nx-set-shas reads the last successful run, for nx affected.
  actions: read

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      # The base and head of nx affected: the last green commit, and this one.
      - uses: nrwl/nx-set-shas@v4

      - name: Install dependencies
        run: npm i

      - name: Lint
        run: npx nx affected -t lint

      - name: Unit tests
        run: npx nx affected -t test

      - name: Build
        run: npx nx affected -t build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npx nx affected -t e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            dist/.playwright/apps/showcase-e2e/
            dist/.playwright/apps/blocks-e2e/
          retention-days: 7

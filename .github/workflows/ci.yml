name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  # nx-set-shas reads the last successful run, for nx affected.
  actions: read

jobs:
  # The apps as built by default, rendered in the browser (client-side: CSR):
  # lint, translations and build — only what the change affects. Their e2e tests
  # are the `csr-e2e` job.
  csr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      # The base and head of nx affected: the last green commit, and this one.
      - uses: nrwl/nx-set-shas@v5

      - name: Install dependencies
        run: npm i

      - name: Lint
        run: npx nx affected -t lint

      - name: Translations
        run: npx nx affected -t check-i18n

      # The showcase's settings aren't in git: the tests' own
      # (scripts/showcase-config.mjs).
      - name: Create showcase config
        run: node scripts/showcase-config.mjs test

      - name: Build
        run: npx nx affected -t build

  # The e2e tests of the client-side apps, a job per group of Playwright
  # projects run side by side (the showcase's suite outgrew one job's 30
  # minutes): demos (two shards), pages, the styles two by two, the phones
  # with the custom app. A job's name says which kind of test failed. Only when the
  # change affects them.
  csr-e2e:
    name: csr-e2e (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: demos-1
            projects: --project=demos --shard=1/2
          - group: demos-2
            projects: --project=demos --shard=2/2
          - group: pages
            projects: --project=pages
          - group: styles-nova-vega
            projects: --project=styles-nova --project=styles-vega
          - group: styles-maia-lyra
            projects: --project=styles-maia --project=styles-lyra
          - group: styles-mira-luma
            projects: --project=styles-mira --project=styles-luma
          - group: styles-sera-rhea
            projects: --project=styles-sera --project=styles-rhea
          # The phones' tests, and the custom app's small suite.
          - group: mobile
            projects: --project=mobile
            custom: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      - uses: nrwl/nx-set-shas@v5

      - name: Install dependencies
        run: npm i

      # Which e2e projects the change affects.
      - name: Affected
        id: affected
        run: |
          projects=$(npx nx show projects --affected -t e2e)
          echo "showcase=$(echo "$projects" | grep -qw showcase-e2e && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "custom=$(echo "$projects" | grep -qw custom-e2e && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # The showcase's settings aren't in git: the tests' own
      # (scripts/showcase-config.mjs).
      - name: Create showcase config
        run: node scripts/showcase-config.mjs test

      - name: Build
        if: steps.affected.outputs.showcase == 'true' || (matrix.custom && steps.affected.outputs.custom == 'true')
        run: npx nx run-many -t build -p showcase custom

      - name: Install Playwright Browsers
        if: steps.affected.outputs.showcase == 'true' || (matrix.custom && steps.affected.outputs.custom == 'true')
        run: npx playwright install --with-deps chromium

      - name: E2E tests (showcase, ${{ matrix.group }})
        if: steps.affected.outputs.showcase == 'true'
        run: npx playwright test -c apps/showcase-e2e/playwright.config.ts ${{ matrix.projects }}

      - name: E2E tests (custom)
        if: ${{ !cancelled() && matrix.custom && steps.affected.outputs.custom == 'true' }}
        run: npx playwright test -c apps/styles/custom-e2e/playwright.config.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.group }}
          path: |
            dist/.playwright/apps/showcase-e2e/
            dist/.playwright/apps/styles/custom-e2e/
          retention-days: 7

  # The apps rendered on the server (the `ssr` build, on its Node server), then
  # hydrated: every e2e test again, plus `ssr.spec.ts` (every page hydrates),
  # in Chromium, in the same groups as `csr-e2e`. Not required: the apps stay
  # client-side by default. Its own Playwright flags: four workers, not the
  # Nx preset's CI default of one (which made it run for hours), two retries, and
  # a reporter that shows progress.
  ssr:
    name: ssr (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: demos-1
            projects: --project=demos --shard=1/2
          - group: demos-2
            projects: --project=demos --shard=2/2
          - group: pages
            projects: --project=pages
          - group: styles-nova-vega
            projects: --project=styles-nova --project=styles-vega
          - group: styles-maia-lyra
            projects: --project=styles-maia --project=styles-lyra
          - group: styles-mira-luma
            projects: --project=styles-mira --project=styles-luma
          - group: styles-sera-rhea
            projects: --project=styles-sera --project=styles-rhea
          # The phones' tests.
          - group: mobile
            projects: --project=mobile
    env:
      SSR: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm i

      # The showcase's settings aren't in git: the tests' own
      # (scripts/showcase-config.mjs).
      - name: Create showcase config
        run: node scripts/showcase-config.mjs test

      - name: Build (SSR)
        run: npx nx build showcase -c ssr

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (showcase, SSR, ${{ matrix.group }})
        run: npx playwright test -c apps/showcase-e2e/playwright.config.ts ${{ matrix.projects }} --workers=4 --retries=2 --reporter=line

      # What failed on the server: Angular logs it, the page still answers 200.
      - name: Server errors
        if: ${{ !cancelled() }}
        run: |
          status=0
          for log in dist/ssr-showcase.log; do
            [ -f "$log" ] || continue
            if grep -qE '^(ERROR|uncaughtException)' "$log"; then
              echo "::error::Server errors in $log"
              grep -E -A6 '^(ERROR|uncaughtException)' "$log" | head -400
              status=1
            fi
          done
          exit $status

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-ssr-${{ matrix.group }}
          path: |
            dist/.playwright/apps/showcase-e2e/
            dist/ssr-*.log
          # Two paths: the artifact starts at dist/, where .playwright is hidden —
          # skipped by default, the failures' traces lost with it.
          include-hidden-files: true
          retention-days: 7

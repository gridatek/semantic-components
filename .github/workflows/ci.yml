name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  # nx-set-shas reads the last successful run, for nx affected.
  actions: read

jobs:
  # The apps as built by default (static, client-only): lint, unit tests,
  # build, then each app's e2e tests — only what the change affects.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      # The base and head of nx affected: the last green commit, and this one.
      - uses: nrwl/nx-set-shas@v4

      - name: Install dependencies
        run: npm i

      - name: Lint
        run: npx nx affected -t lint

      - name: Unit tests
        run: npx nx affected -t test

      - name: Build
        run: npx nx affected -t build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (showcase)
        run: npx nx affected -t e2e --exclude=blocks-e2e

      - name: E2E tests (blocks)
        if: ${{ !cancelled() }}
        run: npx nx affected -t e2e --exclude=showcase-e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            dist/.playwright/apps/showcase-e2e/
            dist/.playwright/apps/blocks-e2e/
          retention-days: 7

  # The apps rendered on the server (the `ssr` build, on its Node server), then
  # hydrated: every e2e test again, plus `ssr.spec.ts` (every page hydrates),
  # in Chromium. Not required: the apps stay static by default. Its own
  # Playwright flags: four workers, not the preset's CI default of one (which
  # made it run for hours), two retries, and a reporter that shows progress.
  ssr:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SSR: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm i

      - name: Build (SSR)
        run: npx nx run-many -t build -p showcase blocks -c ssr

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (showcase, SSR)
        run: npx playwright test -c apps/showcase-e2e/playwright.config.ts --project=chromium --workers=4 --retries=2 --reporter=line

      - name: E2E tests (blocks, SSR)
        if: ${{ !cancelled() }}
        run: npx playwright test -c apps/blocks-e2e/playwright.config.ts --project=chromium --workers=4 --retries=2 --reporter=line

      # What failed on the server: Angular logs it, the page still answers 200.
      - name: Server errors
        if: ${{ !cancelled() }}
        run: |
          status=0
          for log in dist/ssr-showcase.log dist/ssr-blocks.log; do
            [ -f "$log" ] || continue
            if grep -qE '^(ERROR|uncaughtException)' "$log"; then
              echo "::error::Server errors in $log"
              grep -E -A6 '^(ERROR|uncaughtException)' "$log" | head -400
              status=1
            fi
          done
          exit $status

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-ssr
          path: |
            dist/.playwright/apps/showcase-e2e/
            dist/.playwright/apps/blocks-e2e/
            dist/ssr-*.log
          retention-days: 7

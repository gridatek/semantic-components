name: Deploy to Cloudflare Pages

# One site a run, chosen when it's started (Actions → Run workflow): dev by
# default; prod after dev has been checked.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options:
          - dev
          - prod
        default: dev

jobs:
  deploy-showcase:
    if: inputs.target == 'prod'
    runs-on: ubuntu-latest
    name: Deploy Showcase (Prod)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm i

      - name: Create production config
        run: echo '{"devMode":false}' > apps/showcase/public/config.json

      - name: Build Angular app
        run: npx nx build showcase

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/apps/showcase/browser --project-name=semantic-components

  deploy-showcase-dev:
    if: inputs.target == 'dev'
    runs-on: ubuntu-latest
    name: Deploy Showcase (Dev)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm i

      - name: Create dev config
        run: echo '{"devMode":true}' > apps/showcase/public/config.json

      - name: Build Angular app
        run: npx nx build showcase

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/apps/showcase/browser --project-name=semantic-components-dev

name: Sync Custom Style

# The custom app's style (apps/styles/custom/src/app/custom-style) is a copy of nova:
# when nova changes — a new key, a changed class — the copy follows, through a
# pull request (scripts/sync-custom-style.mjs).
on:
  push:
    branches: [main]
    paths:
      - 'libs/styles/nova/src/**'
      - 'libs/styles/src/**'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Starts CI on the PR's branch (below).
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm i

      - name: Sync custom style
        run: npx nx sync-custom-style

      - name: Validate custom style
        run: npx nx validate-custom-style

      - name: Create PR if changes exist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git restore package-lock.json
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          BRANCH="chore/sync-custom-style-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "chore: sync custom style with nova"
          git push --set-upstream origin "$BRANCH"
          gh pr create --title "chore: sync custom style with nova" --body "Automated sync of apps/styles/custom/src/app/custom-style with libs/styles/nova." --base main
          # A PR opened with GITHUB_TOKEN gets its CI run only once a maintainer
          # approves it; a workflow_dispatch from GITHUB_TOKEN runs at once, and
          # its checks show on the PR (same commit).
          gh workflow run ci.yml --ref "$BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Sync Blocks Preset

# The blocks app's preset (apps/blocks/src/app/blocks-nova) is a copy of nova:
# when nova changes — a new key, a changed class — the copy follows, through a
# pull request (scripts/sync-blocks-preset.mjs).
on:
  push:
    branches: [main]
    paths:
      - 'libs/presets/nova/src/**'
      - 'libs/presets/src/**'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm i

      - name: Sync blocks preset
        run: npx nx sync-blocks-preset

      - name: Validate blocks preset
        run: npx nx validate-blocks-preset

      - name: Create PR if changes exist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git restore package-lock.json
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          BRANCH="chore/sync-blocks-preset-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "chore: sync blocks preset with nova"
          git push --set-upstream origin "$BRANCH"
          gh pr create --title "chore: sync blocks preset with nova" --body "Automated sync of apps/blocks/src/app/blocks-nova with libs/presets/nova." --base main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

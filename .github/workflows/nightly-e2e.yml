name: Nightly E2E

on:
  schedule:
    # Midnight UTC (02:00 in Paris in summer, 01:00 in winter).
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

# The e2e tests in the browsers the pull requests' CI doesn't run (it runs
# Chromium, every project): Firefox and WebKit (demos and pages; WebKit's
# phone too: ALL_BROWSERS), both ways the apps can run — client-side (csr),
# and rendered on the server — three shards per engine, side by side.
jobs:
  # The showcase built once per mode, for all its shards (an artifact): one
  # build, the same app tested everywhere, instead of one per job.
  build:
    name: build (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - mode: csr
            build: npx nx build showcase
          - mode: ssr
            build: npx nx build showcase -c ssr
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm i

      # The showcase's settings aren't in git: the tests' own
      # (scripts/showcase-config.mjs).
      - name: Create showcase config
        run: node scripts/showcase-config.mjs test

      - name: Build
        run: ${{ matrix.build }}

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: showcase-${{ matrix.mode }}
          path: dist/apps/showcase/
          retention-days: 1

  # The apps as built by default (client-side).
  csr:
    needs: build
    name: csr (${{ matrix.browser }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
        # Three shards: two ran near the 60-minute limit (SSR in WebKit, 41
        # minutes, then cut off at 60), and more tests are coming.
        shard: [1/3, 2/3, 3/3]
        # Each engine's projects.
        include:
          - browser: firefox
            showcase: --project=demos-firefox --project=pages-firefox
          - browser: webkit
            showcase: --project=demos-webkit --project=pages-webkit --project=mobile-webkit
    env:
      ALL_BROWSERS: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm i

      # The showcase's settings aren't in git: the tests' own
      # (scripts/showcase-config.mjs).
      - name: Create showcase config
        run: node scripts/showcase-config.mjs test

      # The build job's: the e2e server (serve-static, without its build)
      # serves it.
      - name: Download the build
        uses: actions/download-artifact@v7
        with:
          name: showcase-csr
          path: dist/apps/showcase/

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # Four workers and a reporter that shows progress; Nx preset's two
      # retries kept — overnight, a flake is retried.
      - name: E2E tests (showcase)
        run: npx playwright test -c apps/showcase-e2e/playwright.config.ts ${{ matrix.showcase }} --shard=${{ matrix.shard }} --workers=4 --reporter=line

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}-${{ strategy.job-index }}
          path: |
            dist/.playwright/apps/showcase-e2e/
          retention-days: 7

  # The apps rendered on the server (the `ssr` build, on its Node server), then
  # hydrated: every e2e test again, plus `ssr.spec.ts` (every page hydrates),
  # in every browser — as CI's `ssr` job, which runs Chromium only. Three
  # jobs per browser engine, side by side: two each ran close to the 60-minute
  # limit.
  ssr:
    needs: build
    name: ssr (${{ matrix.browser }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
        # Three shards: two ran near the 60-minute limit (SSR in WebKit, 41
        # minutes, then cut off at 60), and more tests are coming.
        shard: [1/3, 2/3, 3/3]
        # Each engine's projects.
        include:
          - browser: firefox
            showcase: --project=demos-firefox --project=pages-firefox
          - browser: webkit
            showcase: --project=demos-webkit --project=pages-webkit --project=mobile-webkit
    env:
      ALL_BROWSERS: true
      SSR: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm i

      # The showcase's settings aren't in git: the tests' own
      # (scripts/showcase-config.mjs).
      - name: Create showcase config
        run: node scripts/showcase-config.mjs test

      # The build job's: its Node server (serve-ssr) runs it.
      - name: Download the build (SSR)
        uses: actions/download-artifact@v7
        with:
          name: showcase-ssr
          path: dist/apps/showcase/

      # Its own engine only.
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # Two retries, as `csr`: a flake is retried, and reported as flaky.
      - name: E2E tests (showcase, SSR)
        run: npx playwright test -c apps/showcase-e2e/playwright.config.ts ${{ matrix.showcase }} --shard=${{ matrix.shard }} --workers=4 --retries=2 --reporter=line

      # What failed on the server: Angular logs it, the page still answers 200.
      - name: Server errors
        if: ${{ !cancelled() }}
        run: |
          status=0
          for log in dist/ssr-showcase.log; do
            [ -f "$log" ] || continue
            if grep -qE '^(ERROR|uncaughtException)' "$log"; then
              echo "::error::Server errors in $log"
              grep -E -A6 '^(ERROR|uncaughtException)' "$log" | head -400
              status=1
            fi
          done
          exit $status

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-ssr-${{ matrix.browser }}-${{ strategy.job-index }}
          path: |
            dist/.playwright/apps/showcase-e2e/
            dist/ssr-*.log
          retention-days: 7

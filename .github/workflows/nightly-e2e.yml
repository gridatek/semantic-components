name: Nightly E2E

on:
  schedule:
    # Midnight UTC (02:00 in Paris in summer, 01:00 in winter).
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

# The e2e tests in the browsers the pull requests' CI doesn't run (it runs
# Chromium, every project): Firefox and WebKit (demos and pages; WebKit's
# phone too: ALL_BROWSERS), both ways the apps can run — client-side (csr),
# and rendered on the server — two shards per engine, side by side.
jobs:
  # The apps as built by default (client-side).
  csr:
    name: csr (${{ matrix.browser }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: firefox
            shard: 1/2
            showcase: --project=demos-firefox --project=pages-firefox
            blocks: --project=firefox
          - browser: firefox
            shard: 2/2
            showcase: --project=demos-firefox --project=pages-firefox
          - browser: webkit
            shard: 1/2
            showcase: --project=demos-webkit --project=pages-webkit --project=mobile-webkit
            blocks: --project=webkit
          - browser: webkit
            shard: 2/2
            showcase: --project=demos-webkit --project=pages-webkit --project=mobile-webkit
    env:
      ALL_BROWSERS: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm i

      # Built first: the e2e server (serve-static) then starts from the cache,
      # within Playwright's start timeout.
      - name: Build
        run: npx nx run-many -t build -p showcase blocks

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # Four workers and a reporter that shows progress; the preset's two
      # retries kept — overnight, a flake is retried.
      - name: E2E tests (showcase)
        run: npx playwright test -c apps/showcase-e2e/playwright.config.ts ${{ matrix.showcase }} --shard=${{ matrix.shard }} --workers=4 --reporter=line

      - name: E2E tests (blocks)
        if: ${{ !cancelled() && matrix.blocks }}
        run: npx playwright test -c apps/blocks-e2e/playwright.config.ts ${{ matrix.blocks }} --workers=4 --reporter=line

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}-${{ strategy.job-index }}
          path: |
            dist/.playwright/apps/showcase-e2e/
            dist/.playwright/apps/blocks-e2e/
          retention-days: 7

  # The apps rendered on the server (the `ssr` build, on its Node server), then
  # hydrated: every e2e test again, plus `ssr.spec.ts` (every page hydrates),
  # in every browser — as CI's `ssr` job, which runs Chromium only. One job
  # per browser engine, side by side: all of them in one ran close to the
  # 60-minute limit.
  ssr:
    name: ssr (${{ matrix.browser }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: firefox
            shard: 1/2
            showcase: --project=demos-firefox --project=pages-firefox
            blocks: --project=firefox
          - browser: firefox
            shard: 2/2
            showcase: --project=demos-firefox --project=pages-firefox
          - browser: webkit
            shard: 1/2
            showcase: --project=demos-webkit --project=pages-webkit --project=mobile-webkit
            blocks: --project=webkit
          - browser: webkit
            shard: 2/2
            showcase: --project=demos-webkit --project=pages-webkit --project=mobile-webkit
    env:
      ALL_BROWSERS: true
      SSR: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm i

      - name: Build (SSR)
        run: npx nx run-many -t build -p showcase blocks -c ssr

      # Its own engine only.
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # Two retries, as `csr`: a flake is retried, and reported as flaky.
      - name: E2E tests (showcase, SSR)
        run: npx playwright test -c apps/showcase-e2e/playwright.config.ts ${{ matrix.showcase }} --shard=${{ matrix.shard }} --workers=4 --retries=2 --reporter=line

      - name: E2E tests (blocks, SSR)
        if: ${{ !cancelled() && matrix.blocks }}
        run: npx playwright test -c apps/blocks-e2e/playwright.config.ts ${{ matrix.blocks }} --workers=4 --retries=2 --reporter=line

      # What failed on the server: Angular logs it, the page still answers 200.
      - name: Server errors
        if: ${{ !cancelled() }}
        run: |
          status=0
          for log in dist/ssr-showcase.log dist/ssr-blocks.log; do
            [ -f "$log" ] || continue
            if grep -qE '^(ERROR|uncaughtException)' "$log"; then
              echo "::error::Server errors in $log"
              grep -E -A6 '^(ERROR|uncaughtException)' "$log" | head -400
              status=1
            fi
          done
          exit $status

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-ssr-${{ matrix.browser }}-${{ strategy.job-index }}
          path: |
            dist/.playwright/apps/showcase-e2e/
            dist/.playwright/apps/blocks-e2e/
            dist/ssr-*.log
          retention-days: 7
